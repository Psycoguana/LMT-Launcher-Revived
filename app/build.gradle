plugins { id 'com.android.application' }

// Version scheme carried over from the upstream build.sh:
//   versionCode = major * 1000 + minor * 100   (3.10 -> 4000, 3.11 -> 4100)
def versionMajor = 3
def versionMinor = 11

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore/key.properties")
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.noname81.lmt'
    compileSdk 36

    defaultConfig {
        applicationId 'com.noname81.lmt'
        minSdk 21
        targetSdk 34
        versionCode versionMajor * 1000 + versionMinor * 100
        versionName "${versionMajor}.${versionMinor}"
    }

    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile rootProject.file("keystore/${keystoreProps['storeFile']}")
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Kept off during the reconstruction: the equivalence oracle diffs our
            // dex against the reference smali, and shrinking would rewrite it.
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            // The root helper is built from source by :inputcontext rather than
            // shipped prebuilt; its dex jar lands here and is packaged as an asset.
            assets.srcDirs += files(project(':inputcontext')
                    .layout.buildDirectory.dir('inputcontext/assets'))
        }
    }

    buildFeatures {
        // getVersion() reads BuildConfig.VERSION_NAME so the in-app version can
        // never drift from the APK's versionName.
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }

    testOptions {
        unitTests {
            // Action and TouchServiceResult reference android.* types in fields but
            // the logic under test never calls into them; returning defaults keeps
            // these as fast plain-JVM tests instead of needing an emulator.
            returnDefaultValues = true
            includeAndroidResources = true
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // ROADMAP 1.6: Material 3 shell for LMT (AppCompatActivity, MaterialToolbar,
    // TabLayout, ViewPager2) plus AndroidX Preference for the phase-2 Settings rewrite.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.preference:preference:1.2.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
}

// The helper jar is a generated asset, so every task that reads the assets tree has
// to wait for it - asset merging, packaging, and the lint model writers, which scan
// source sets too.
tasks.configureEach { task ->
    if (task.name ==~ /(?i).*(assets|lint).*/) {
        task.dependsOn ':inputcontext:helperJar'
    }
}
